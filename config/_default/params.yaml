# This params.yaml overrides the theme's default params.yaml.
# A full list of available params with their default values can be found in the theme's config/_default/params.yaml file.
favicon: img/favicon.png

footer:
  since: 2023

sidebar:
  # emoji: 🍥
  subtitle: 日拱一卒，终成大师
  avatar: img/wujin-master.jpg

comments:
  enabled: false
  provider: disqus

widgets:
  homepage:
    - type: search
    - type: archives
      params:
        limit: 5
    - type: taxonomy
      params:
        limit: 10
        taxonomy: tags
        icon: tag
    - type: taxonomy
      params:
        limit: 10
        taxonomy: categories
        icon: categories
  page:
    - type: toc
